<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - Next Gen Contacts</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f0f9ff);color:#172033}.wrap{width:92%;max-width:720px;margin:50px auto}.card{background:white;border-radius:22px;padding:30px;box-shadow:0 15px 45px rgba(30,41,59,.12)}h1{color:#312e81;margin-top:0}.avatar{width:75px;height:75px;border-radius:20px;background:linear-gradient(135deg,#312e81,#0284c7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin-bottom:18px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px;color:#475569}input{width:100%;padding:13px;border:1px solid #dbe3ef;border-radius:11px;font-size:15px}button{padding:12px 18px;border:0;border-radius:11px;background:#4f46e5;color:white;font-weight:700;cursor:pointer;margin-top:16px}.back{display:inline-block;margin-left:8px;color:#4f46e5;text-decoration:none}.message{margin-top:14px;font-size:14px}</style></head>
<body><div class="wrap"><div class="card"><div class="avatar" id="avatar">U</div><h1>My Profile</h1><p id="emailText">Loading...</p><label>First Name</label><input id="firstname"><label>Last Name</label><input id="lastname"><button onclick="saveProfile()">Save Profile</button><a class="back" href="/login/contact">Back to Dashboard</a><div class="message" id="message"></div></div></div>
<script>
async function load(){const r=await fetch('/api/auth/me');if(!r.ok){location.href='/login';return}const u=await r.json();firstname.value=u.firstname||'';lastname.value=u.lastname||'';emailText.textContent=u.email;avatar.textContent=(u.firstname||u.email||'U').charAt(0).toUpperCase()}
async function saveProfile(){const r=await fetch('/api/auth/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstname:firstname.value.trim(),lastname:lastname.value.trim()})});const m=document.getElementById('message');m.textContent=r.ok?'Profile updated successfully.':'Unable to update profile.';if(r.ok)load()}
load();
</script></body></html>
