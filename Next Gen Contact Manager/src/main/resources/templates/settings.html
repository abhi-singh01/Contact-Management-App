<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings - Next Gen Contacts</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f0f9ff);color:#172033}.wrap{width:92%;max-width:720px;margin:50px auto}.card{background:white;border-radius:22px;padding:30px;box-shadow:0 15px 45px rgba(30,41,59,.12);margin-bottom:20px}h1,h2{color:#312e81;margin-top:0}label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px;color:#475569}input{width:100%;padding:13px;border:1px solid #dbe3ef;border-radius:11px;font-size:15px}button{padding:12px 18px;border:0;border-radius:11px;background:#4f46e5;color:white;font-weight:700;cursor:pointer;margin-top:16px}.back{display:inline-block;margin-left:8px;color:#4f46e5;text-decoration:none}.message{margin-top:14px;font-size:14px}</style></head>
<body><div class="wrap"><div class="card"><h1>Settings</h1><p>Manage your account security.</p><h2>Change Password</h2><label>Current Password</label><input id="currentPassword" type="password"><label>New Password</label><input id="newPassword" type="password"><button onclick="changePassword()">Update Password</button><div class="message" id="message"></div></div><div class="card"><a class="back" href="/login/contact">← Back to Dashboard</a></div></div>
<script>async function changePassword(){const r=await fetch('/api/auth/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});const m=document.getElementById('message');if(r.ok){m.textContent='Password changed successfully.';currentPassword.value='';newPassword.value=''}else{const d=await r.json().catch(()=>({}));m.textContent=d.error||'Unable to change password.'}}</script></body></html>
