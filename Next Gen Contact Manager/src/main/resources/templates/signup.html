<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Contact Manager</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f0f9ff);display:flex;align-items:center;justify-content:center;color:#172033}.card{width:92%;max-width:430px;background:rgba(255,255,255,.9);padding:34px;border-radius:24px;box-shadow:0 20px 55px rgba(30,41,59,.14);border:1px solid white}.logo{text-align:center;font-size:27px;font-weight:800;color:#312e81;margin-bottom:8px}.subtitle{text-align:center;color:#64748b;margin-bottom:25px;font-size:14px}input{width:100%;padding:13px 14px;margin:7px 0;border:1px solid #dbe3ef;border-radius:11px;font-size:15px;outline:none}input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#312e81);color:white;font-size:15px;font-weight:700;cursor:pointer}.back{display:block;text-align:center;margin-top:18px;color:#4f46e5;text-decoration:none;font-size:13px}</style>
</head>
<body><div class="card"><div class="logo">✦ Next Gen Contacts</div><div class="subtitle">Join Next Gen Contacts</div><form action="/register/user" method="post"><input type="text" placeholder="First Name" name="firstname" required><input type="text" placeholder="Last Name" name="lastname" required><input type="text" placeholder="Email" name="email" required><input type="password" placeholder="Password" name="password" required><button type="submit">Create Account</button></form><a class="back" href="/">← Back to Home</a></div></body></html>
